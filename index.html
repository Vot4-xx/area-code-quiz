<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Code Quiz - 首页</title>
  <!-- 引入 Leaflet 地图样式库 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* =========================================================
       1. 全局主题色彩定义（双主题 CSS 变量）
       ========================================================= */
    :root {
      --bg-color: #e2e8f0;           
      --container-bg: #ffffff;      
      --topbar-bg: #ffffff;         
      --topbar-text: #2d3748;       
      --border-color: #cbd5e1;     
      --badge-bg: #edf2f7;          
      --badge-text: #4a5568;        
      --target-color: #008751;      
      --target-box-bg: #f8fafc;     
    }

    body.dark-mode {
      --bg-color: #090d16;           
      --container-bg: #111827;      
      --topbar-bg: #111827;         
      --topbar-text: #f3f4f6;       
      --border-color: #1f2937;     
      --badge-bg: #1f2937;          
      --badge-text: #9ca3af;        
      --target-color: #38bdf8;      
      --target-box-bg: #0b0f19;     
    }

    html {
      background-color: var(--bg-color) !important;
      transition: background-color 0.3s ease;
      height: 100%;
      width: 100%;
    }

    body { 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh;
      font-family: sans-serif; 
      background-color: var(--bg-color) !important; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      transition: background-color 0.3s ease;
    }

    /* 视图切换容器 */
    .view-container {
      display: none;
      width: 94vw;
      max-width: 1100px;
      height: 90vh;
      background: var(--container-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: background 0.3s, border 0.3s;
    }
    .view-container.active {
      display: flex;
    }

    /* =========================================================
       2. 主页面 (Dashboard) 样式
       ========================================================= */
    #home-view {
      padding: 30px 40px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .home-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
    }

    .home-title {
      font-size: 26px;
      font-weight: bold;
      color: var(--topbar-text);
      margin: 0;
    }

    /* 🎯 优化：网格紧凑排版，贴合红色框范围 */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, 280px);
      gap: 24px;
      width: 100%;
    }

    .quiz-card {
      background: var(--target-box-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 180px;
      box-sizing: border-box;
    }

    .quiz-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border-color: var(--target-color);
    }

    .quiz-card h3 {
      margin: 0 0 10px 0;
      color: var(--topbar-text);
      font-size: 20px;
    }

    .quiz-card p {
      color: var(--badge-text);
      font-size: 13px;
      margin: 0;
    }

    .card-btn {
      background: var(--target-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    /* =========================================================
       3. 游戏界面样式 (#game-view)
       ========================================================= */
    #top-bar {
      height: 65px;
      background: var(--topbar-bg);
      color: var(--topbar-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      border-bottom: 2px solid var(--border-color);
      font-size: 16px;
      flex-shrink: 0;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .top-right {
      justify-content: flex-end;
    }

    .stat-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      letter-spacing: 0.5px;
      font-size: 14px;
    }

    .target-prompt {
      flex: 1;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .target-prompt span {
      background: var(--target-box-bg);
      padding: 6px 20px;
      border-radius: 10px;
      color: var(--target-color);
      border: 1px solid var(--border-color);
      font-size: 30px; 
      font-weight: bold;
      letter-spacing: 1px;
    }

    .icon-btn {
      background: var(--badge-bg);
      color: var(--badge-text);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .icon-btn:hover { background: #cbd5e1; transform: scale(1.05); }
    body.dark-mode .icon-btn:hover { background: #374151; }

    #map {
      flex: 1;
      width: 100%;
    }

    #feedback-banner {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* 弹窗样式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: var(--container-bg);
      color: var(--topbar-text);
      padding: 30px 40px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: 320px;
    }
    .modal-box h2 { margin-top: 0; font-size: 20px; }
    
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .setting-row input {
      width: 65px;
      padding: 6px;
      background: var(--target-box-bg);
      border: 1px solid var(--border-color);
      color: var(--topbar-text);
      text-align: center;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-start { background: #008751; }
    .btn-restart { background: #dc2626; }
    .btn-close { background: #4b5563; }
    .btn-home { background: #334155; }
  </style>
</head>
<body>

  <!-- =========================================================
     视图 1：主页面 (Home Dashboard)
     ========================================================= -->
  <div id="home-view" class="view-container active">
    <div class="home-header">
      <h1 class="home-title">🌍 Area Code Quiz</h1>
      <button class="icon-btn" id="theme-toggle-home" onclick="toggleTheme()" title="切换明暗模式">🌙</button>
    </div>
    
    <div class="quiz-grid">
      <!-- 🎯 优化：精简标题为“巴西区号”，去掉了描述小字 -->
      <div class="quiz-card" onclick="startBrazilQuiz()">
        <h3>🇧🇷 巴西区号</h3>
        <button class="card-btn">开始挑战</button>
      </div>

      <!-- 预留未来扩展的其他测验卡片位 -->
      <div class="quiz-card" style="opacity: 0.6; cursor: not-allowed;">
        <h3>🚀 更多区域</h3>
        <button class="card-btn" style="background: #94a3b8;" disabled>敬请期待</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
     视图 2：游戏主界面 (Game View)
     ========================================================= -->
  <div id="game-view" class="view-container">
    <!-- 顶部状态栏 -->
    <div id="top-bar">
      <div class="top-left">
        <div class="stat-badge" id="score-fraction">进度: 0/0</div>
        <div class="stat-badge" id="mistake-badge">失误: 0/<span id="max-mistake-display">2</span></div>
      </div>
      
      <div class="target-prompt">
        <span id="target-ddd">--</span>
      </div>

      <div class="top-right">
        <div class="stat-badge" id="time-val" style="color: #ef4444;">600秒</div>
        <button class="icon-btn" id="theme-toggle-game" onclick="toggleTheme()" title="切换明暗模式">🌙</button>
        <button class="icon-btn" onclick="toggleSettings()" title="游戏设置与控制">⚙️</button>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <div id="feedback-banner"></div>

  <!-- ⚙️ 设置与控制弹窗面板 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box" style="text-align: left;">
      <h2>⚙️ 游戏设置与控制</h2>
      
      <div style="margin: 20px 0;">
        <div class="setting-row">
          <label>倒计时时长(秒):</label>
          <input type="number" id="setting-time" value="600" min="10" max="3600">
        </div>
        <div class="setting-row">
          <label>单题最大错误数:</label>
          <input type="number" id="setting-mistakes" value="2" min="1" max="10">
        </div>
      </div>

      <div style="border-top: 1px solid var(--border-color); padding-top: 15px;">
        <button class="btn btn-start" id="start-btn" onclick="toggleGame()">开始游戏</button>
        <button class="btn btn-restart" onclick="resetGame(); closeSettings();">重新开始</button>
        <button class="btn btn-close" onclick="closeSettings()">返回游戏</button>
        <button class="btn btn-home" onclick="returnToHome()">返回主页</button>
      </div>
    </div>
  </div>

  <!-- 🏆 游戏结束结算弹窗 -->
  <div class="modal-overlay" id="game-over-modal">
    <div class="modal-box">
      <h2 id="modal-title" style="color: #008751;">游戏结束</h2>
      <p style="font-size: 18px; margin: 15px 0;">最终成绩：<span id="final-score" style="color: #008751; font-weight: bold;">(0/0)</span></p>
      <p style="font-size: 14px; color: #6b7280; margin-bottom: 25px;">总错误次数：<span id="final-mistakes">0</span> 次</p>
      <button class="btn btn-start" onclick="closeModalAndReset()" style="width: 100%;">再玩一次</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 初始化地图
    const map = L.map('map').setView([-14.2350, -51.9253], 4);

    const lightTile = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; Google Maps'
    });

    lightTile.addTo(map);

    let allFeatures = [];
    let gameQuestions = []; 
    let currentQuestionIndex = 0;
    let currentTarget = null;
    let correctCount = 0;
    let totalQuestions = 0;
    let currentMistakes = 0;
    let maxMistakes = 2;
    let totalMistakes = 0;
    let timeLeft = 600;
    let maxTime = 600;
    let timerInterval = null;
    let isPlaying = false;
    let isPaused = false;
    let geojsonLayer;

    function style(feature) {
      const isDark = document.body.classList.contains('dark-mode');
      return {
        fillColor: isDark ? '#334155' : '#38b000',
        weight: 1.5,
        opacity: 1,
        color: '#ffffff',
        fillOpacity: 0.4
      };
    }

    // 切换全局明暗主题
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      const themeText = isDark ? '☀️' : '🌙';
      document.getElementById('theme-toggle-home').innerText = themeText;
      document.getElementById('theme-toggle-game').innerText = themeText;
      
      if (geojsonLayer) {
        geojsonLayer.setStyle(style);
      }
    }

    // 视图切换：从主页进入巴西区号测验
    function startBrazilQuiz() {
      document.getElementById('home-view').classList.remove('active');
      document.getElementById('game-view').classList.add('active');
      setTimeout(() => { 
        map.invalidateSize(); 
        openSettings();
      }, 200);
    }

    // 视图切换：从测验返回主页
    function returnToHome() {
      resetGame();
      closeSettings();
      document.getElementById('game-over-modal').style.display = 'none';
      document.getElementById('game-view').classList.remove('active');
      document.getElementById('home-view').classList.add('active');
    }

    // 齿轮按钮控制设置面板
    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      if (modal.style.display === 'flex') {
        closeSettings();
      } else {
        openSettings();
      }
    }

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
      if (isPlaying) {
        isPaused = true;
      }
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
      if (isPlaying) {
        isPaused = false;
      }
    }

    function toggleGame() {
      if (!isPlaying) {
        initGame();
        closeSettings();
      }
    }

    function initGame() {
      maxTime = parseInt(document.getElementById('setting-time').value) || 600;
      maxMistakes = parseInt(document.getElementById('setting-mistakes').value) || 2;
      document.getElementById('max-mistake-display').innerText = maxMistakes;

      if (allFeatures.length === 0) {
        alert('地图数据尚未加载完成！');
        return;
      }

      let shuffled = [...allFeatures].sort(() => 0.5 - Math.random());
      gameQuestions = shuffled; 
      totalQuestions = gameQuestions.length;

      currentQuestionIndex = 0;
      correctCount = 0;
      currentMistakes = 0;
      totalMistakes = 0;
      timeLeft = maxTime;
      isPlaying = true;
      isPaused = false;

      updateUI();
      hideFeedback();
      document.getElementById('game-over-modal').style.display = 'none';
      document.getElementById('start-btn').innerText = "游戏中...";
      document.getElementById('start-btn').disabled = true;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused && isPlaying) {
          timeLeft--;
          document.getElementById('time-val').innerText = timeLeft + "秒";
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            endGame("⏰ 时间到！游戏结束");
          }
        }
      }, 1000);

      loadNextQuestion();
    }

    function resetGame() {
      if (timerInterval) clearInterval(timerInterval);
      isPlaying = false;
      isPaused = false;
      document.getElementById('start-btn').innerText = "开始游戏";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('target-ddd').innerText = "--";
      hideFeedback();
      document.getElementById('score-fraction').innerText = `进度: 0/${allFeatures.length}`;
      document.getElementById('time-val').innerText = document.getElementById('setting-time').value + "秒";
      document.getElementById('mistake-badge').innerHTML = `失误: 0/<span id="max-mistake-display">${document.getElementById('setting-mistakes').value}</span>`;
      if (geojsonLayer) geojsonLayer.setStyle(style);
    }

    function closeModalAndReset() {
      document.getElementById('game-over-modal').style.display = 'none';
      resetGame();
      openSettings();
    }

    function endGame(titleText) {
      isPlaying = false;
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('modal-title').innerText = titleText;
      document.getElementById('final-score').innerText = `(${correctCount}/${totalQuestions})`;
      document.getElementById('final-mistakes').innerText = totalMistakes;
      document.getElementById('game-over-modal').style.display = 'flex';
      resetGame();
    }

    function updateUI() {
      document.getElementById('score-fraction').innerText = `进度: ${correctCount}/${totalQuestions}`;
      document.getElementById('time-val').innerText = timeLeft + "秒";
      document.getElementById('mistake-badge').innerHTML = `失误: ${currentMistakes}/<span id="max-mistake-display">${maxMistakes}</span>`;
    }

    function showFeedback(text, color) {
      const banner = document.getElementById('feedback-banner');
      banner.innerText = text;
      banner.style.background = color;
      banner.style.display = 'block';
    }

    function hideFeedback() {
      document.getElementById('feedback-banner').style.display = 'none';
    }

    function loadNextQuestion() {
      if (!isPlaying) return;
      if (currentQuestionIndex >= gameQuestions.length) {
        endGame("🏆 恭喜通关所有区域！");
        return;
      }

      currentMistakes = 0;
      updateUI();

      const currentFeature = gameQuestions[currentQuestionIndex];
      currentTarget = currentFeature.properties.description;
      document.getElementById('target-ddd').innerText = currentTarget;
    }

    function highlightCorrectAnswer() {
      geojsonLayer.eachLayer(layer => {
        if (String(layer.feature.properties.description) === String(currentTarget)) {
          layer.setStyle({ fillColor: '#dc2626', fillOpacity: 0.8 });
          setTimeout(() => {
            geojsonLayer.resetStyle(layer);
          }, 1500);
        }
      });
    }

    function onEachFeature(feature, layer) {
      const props = feature.properties;
      const dddValue = props.description;

      layer.on({
        mouseover: (e) => {
          if (isPlaying && !isPaused) e.target.setStyle({ fillOpacity: 0.7 });
        },
        mouseout: (e) => {
          if (isPlaying && !isPaused) geojsonLayer.resetStyle(e.target);
        },
        click: (e) => {
          if (!isPlaying || isPaused) return;

          if (String(dddValue) === String(currentTarget)) {
            showFeedback(`🎉 答对了！区号 ${dddValue}`, "#16a34a");
            correctCount++;
            currentQuestionIndex++;
            updateUI();
            
            e.target.setStyle({ fillColor: '#16a34a', fillOpacity: 0.8 });
            setTimeout(() => {
              if (isPlaying) {
                geojsonLayer.resetStyle(e.target);
                loadNextQuestion();
                hideFeedback();
              }
            }, 800);

          } else {
            currentMistakes++;
            totalMistakes++;
            updateUI();

            if (currentMistakes >= maxMistakes) {
              showFeedback(`❌ 错误次数达上限！正确是区号 ${currentTarget}`, "#dc2626");
              highlightCorrectAnswer();

              currentQuestionIndex++;
              setTimeout(() => {
                if (isPlaying) {
                  loadNextQuestion();
                  hideFeedback();
                }
              }, 1500);
            } else {
              showFeedback(`❌ 猜错了（${currentMistakes}/${maxMistakes}次），你点的是区号 ${dddValue}`, "#ea580c");
            }
          }
        }
      });
    }

    fetch('brazil_ddd.geojson')
      .then(response => {
        if (!response.ok) throw new Error("找不到对应文件！");
        return response.json();
      })
      .then(data => {
        allFeatures = data.features;
        geojsonLayer = L.geoJSON(data, {
          style: style,
          onEachFeature: onEachFeature
        }).addTo(map);

        resetGame();
      })
      .catch(err => {
        alert(err.message);
        console.error(err);
      });
  </script>
</body>
</html>
